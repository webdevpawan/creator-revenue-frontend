<aside class="flex flex-col w-60 h-full bg-white border-r border-gray-100 px-4 py-6 shrink-0">

  <!-- Logo + Close button -->
  <div class="flex items-center justify-between px-3 mb-8">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center shadow-sm shrink-0">
        <svg class="w-4.5 h-4.5 text-white" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 14 L6 9 L10 12 L14 6 L17 10" stroke="white" stroke-width="1.75" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <p class="text-sm font-semibold text-gray-900 leading-tight">Creator Revenue</p>
        <p class="text-[10px] text-gray-400 font-medium tracking-wide uppercase">Intelligence</p>
      </div>
    </div>

    <!-- ✅ Close button — missing in your HTML -->
    <button
      type="button"
      (click)="closeRequested.emit()"
      class="lg:hidden w-7 h-7 rounded-lg flex items-center justify-center
             text-gray-400 hover:text-gray-600 hover:bg-gray-100
             transition-colors shrink-0"
      aria-label="Close navigation menu"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

  </div>

  <!-- Navigation -->
       <nav class="flex flex-col gap-0.5 flex-1">
        <p class="text-[10px] font-semibold text-gray-400
                  tracking-widest uppercase px-3 mb-2">
          Main
        </p>
 
        <a
          *ngFor="let item of navItems; trackBy: trackByRoute"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeRequested.emit()"
          class="nav-link flex items-center gap-3 px-3 py-2.5
                 text-sm font-medium rounded-xl text-gray-600
                 hover:text-gray-900 hover:bg-gray-100
                 transition-all duration-150 cursor-pointer"
        >
          <span class="w-5 h-5 flex items-center justify-center shrink-0"
                [innerHTML]="item.icon">
          </span>
          <span>{{ item.label }}</span>
        </a>
      </nav>

  <!-- Bottom section -->
  <div class="mt-auto pt-4 border-t border-gray-100">
    <div class="flex items-center gap-2.5 px-3 py-2">
      <div class="w-7 h-7 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center shrink-0">
        <span class="text-xs font-semibold text-white">{{userInitials}}</span>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-medium text-gray-800 truncate">{{userName}}</p>
        <p class="text-[11px] text-gray-400 truncate">Free Plan</p>
      </div>
    </div>
  </div>

</aside>
