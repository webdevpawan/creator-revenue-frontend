<aside class="hidden lg:flex flex-col w-60 min-h-screen bg-white border-r border-gray-100 px-4 py-6 shrink-0">
 
      <!-- Logo -->
      <div class="flex items-center gap-2.5 px-3 mb-8">
        <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center shadow-sm">
          <svg class="w-4.5 h-4.5 text-white" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 14 L6 9 L10 12 L14 6 L17 10" stroke="white" stroke-width="1.75" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <p class="text-sm font-semibold text-gray-900 leading-tight">Creator Revenue</p>
          <p class="text-[10px] text-gray-400 font-medium tracking-wide uppercase">Intelligence</p>
        </div>
      </div>
 
      <!-- Navigation -->
        <nav class="flex flex-col gap-0.5 flex-1">
        <p class="text-[10px] font-semibold text-gray-400 tracking-widest uppercase px-3 mb-2">Main</p>

        <a
            *ngFor="let item of navItems; trackBy: trackByRoute"
            [routerLink]="item.route"
            routerLinkActive="active"
            class="nav-link"
            [routerLinkActiveOptions]="linkOptions"
        >
            <span class="w-5 h-5 flex items-center justify-center" [innerHTML]="item.icon"></span>
            <span>{{ item.label }}</span>
        </a>
        </nav>
 
      <!-- Bottom section -->
      <div class="mt-auto pt-4 border-t border-gray-100">
        <div class="flex items-center gap-2.5 px-3 py-2">
          <div class="w-7 h-7 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center">
            <span class="text-xs font-semibold text-white">CR</span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-medium text-gray-800 truncate">Creator Account</p>
            <p class="text-[11px] text-gray-400 truncate">Free Plan</p>
          </div>
        </div>
      </div>
    </aside>
