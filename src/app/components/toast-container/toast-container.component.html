<div class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none">
  <div
    *ngFor="let toast of toasts$ | async; trackBy: trackById"
    class="toast-enter pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium max-w-sm"
     [ngClass]="{
        'bg-green-50 text-green-800 border border-green-200': toast.type === 'success',
        'bg-red-50 text-red-800 border border-red-200': toast.type === 'error',
        'bg-blue-50 text-blue-800 border border-blue-200': toast.type === 'info'
      }"
  >
    <span class="text-base">
      <ng-container *ngIf="toast.type === 'success'">✓</ng-container>
      <ng-container *ngIf="toast.type === 'error'">✕</ng-container>
      <ng-container *ngIf="toast.type === 'info'">ℹ</ng-container>
    </span>
    <span>{{ toast.message }}</span>
    <button
      (click)="toastService.dismiss(toast.id)"
      class="ml-auto opacity-70 hover:opacity-100 transition-opacity"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>
