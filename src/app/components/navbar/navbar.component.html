    <header class="h-14 bg-white border-b border-gray-100 px-6 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <!-- Mobile menu (simplified) -->
        <div class="lg:hidden w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center mr-1">
          <svg class="w-4 h-4 text-white" viewBox="0 0 20 20" fill="none">
            <path d="M3 12 L6 7 L10 10 L14 4 L17 8" stroke="white" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1 class="text-sm font-semibold text-gray-900">{{ pageTitle$ | async }}</h1>
          <p class="text-xs text-gray-400 hidden sm:block">{{ pageSubtitle$ | async }}</p>
        </div>
      </div>
 
      <div class="flex items-center gap-3">
        <!-- Notifications bell -->
        <button class="relative w-9 h-9 rounded-xl hover:bg-gray-100 flex items-center justify-center transition-colors">
          <svg class="w-4.5 h-4.5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
        </button>
 
        <!-- User avatar + logout -->
        <div class="flex items-center gap-2 pl-2 border-l border-gray-100">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center">
            <span class="text-xs font-semibold text-white">{{ userInitials }}</span>
          </div>
          <div class="hidden sm:block">
            <p class="text-xs font-medium text-gray-800 leading-tight">{{ userName }}</p>
            <p class="text-[11px] text-gray-400">Creator</p>
          </div>
          <button
            (click)="logout()"
            class="ml-1 w-8 h-8 rounded-xl hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-600 transition-colors"
            title="Sign out"
          >
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
          </button>
        </div>
      </div>
    </header>
