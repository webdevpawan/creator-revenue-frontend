<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Subtle background blobs -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-32 -right-32 w-80 h-80 rounded-full bg-indigo-100 opacity-50 blur-3xl"></div>
    <div class="absolute -bottom-32 -left-32 w-80 h-80 rounded-full bg-violet-100 opacity-40 blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-sm auth-animate">

    <!-- Brand mark -->
    <div class="flex flex-col items-center mb-8">
      <div
        class="w-11 h-11 rounded-2xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-200/60 mb-4">
        <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5">
          <path d="M3 17L7 10L12 14L17 6L21 11" stroke="white" stroke-width="2.25" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </div>
      <h1 class="text-lg font-semibold text-gray-900 tracking-tight">Creator Revenue</h1>
      <p class="text-xs text-gray-400 mt-0.5 tracking-wide">Intelligence Platform</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm px-6 pt-6 pb-7">

      <div class="mb-5">
        <h2 class="text-base font-semibold text-gray-900">Welcome back</h2>
        <p class="text-sm text-gray-400 mt-0.5">Sign in to your account</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="on" novalidate class="space-y-4">

        <!-- Email -->
        <div>
          <label for="login-email" class="block text-xs font-medium text-gray-700 mb-1.5">
            Email address
          </label>
          <input id="login-email" type="email" formControlName="email" placeholder="you@example.com"
            autocomplete="email" class="input-field" [class.error]="isInvalid('email')" />
          <p *ngIf="isInvalid('email')" class="mt-1.5 text-xs text-red-500 flex items-center gap-1">
            <svg class="w-3 h-3 shrink-0" viewBox="0 0 12 12" fill="currentColor">
              <path
                d="M6 1a5 5 0 100 10A5 5 0 006 1zm0 9A4 4 0 116 2a4 4 0 010 8zm-.5-5.5v2a.5.5 0 001 0v-2a.5.5 0 00-1 0zM6 8a.5.5 0 100-1 .5.5 0 000 1z" />
            </svg>
            <ng-container *ngIf="f['email'].errors?.['required']; else emailFormatError">
              Email is required
            </ng-container>
            <ng-template #emailFormatError>
              <ng-container *ngIf="f['email'].errors?.['email']">
                Enter a valid email address
              </ng-container>
            </ng-template>
          </p>
        </div>

        <!-- Password -->
        <div>
          <label for="login-password" class="block text-xs font-medium text-gray-700 mb-1.5">
            Password
          </label>
          <div class="relative">
            <input id="login-password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
              placeholder="••••••••" autocomplete="current-password" class="input-field pr-10"
              [class.error]="isInvalid('password')" />
            <button type="button" (click)="showPassword = !showPassword"
              class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                <!-- Eye-off icon (password visible) -->
                <ng-container *ngIf="showPassword">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                </ng-container>
                <!-- Eye icon (password hidden) -->
                <ng-container *ngIf="!showPassword">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </ng-container>
              </svg>
            </button>
          </div>
          <p *ngIf="isInvalid('password')" class="mt-1.5 text-xs text-red-500 flex items-center gap-1">
            <svg class="w-3 h-3 shrink-0" viewBox="0 0 12 12" fill="currentColor">
              <path
                d="M6 1a5 5 0 100 10A5 5 0 006 1zm0 9A4 4 0 116 2a4 4 0 010 8zm-.5-5.5v2a.5.5 0 001 0v-2a.5.5 0 00-1 0zM6 8a.5.5 0 100-1 .5.5 0 000 1z" />
            </svg>
            <ng-container *ngIf="f['password'].errors?.['required']; else passwordLengthError">
              Password is required
            </ng-container>
            <ng-template #passwordLengthError>
              <ng-container *ngIf="f['password'].errors?.['minlength']">
                At least 6 characters required
              </ng-container>
            </ng-template>
          </p>
        </div>

        <!-- API error banner -->
        <div *ngIf="errorMessage"
          class="flex items-start gap-2.5 p-3 bg-red-50 border border-red-100 rounded-xl auth-error-shake">
          <svg class="w-4 h-4 text-red-500 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <circle cx="12" cy="12" r="9" />
            <path stroke-linecap="round" d="M12 8v4m0 4h.01" />
          </svg>
          <p class="text-xs text-red-600 leading-relaxed">{{ errorMessage }}</p>
        </div>

        <!-- Submit -->
        <button type="submit" [disabled]="loading" class="btn-primary w-full justify-center py-2.5 mt-1">
          <ng-container *ngIf="loading; else signInLabel">
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
            </svg>
            <span>Signing in…</span>
          </ng-container>
          <ng-template #signInLabel>
            <span>Sign in</span>
            <svg class="w-3.5 h-3.5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>
          </ng-template>
        </button>

        <div class="mt-4">
          <div id="google-btn" class="flex justify-center"></div>
        </div>

      </form>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-px bg-gray-100"></div>
        <span class="text-xs text-gray-300 font-medium">or</span>
        <div class="flex-1 h-px bg-gray-100"></div>
      </div>

      <!-- Sign-up link -->
      <p class="text-center text-sm text-gray-500">
        Don't have an account?
        <a routerLink="/signup" class="font-medium text-indigo-600 hover:text-indigo-700 transition-colors ml-1">
          Sign up free
        </a>
      </p>

    </div>

    <p class="text-center text-xs text-gray-400 mt-5">
      © {{ year }} Creator Revenue Intelligence
    </p>

  </div>
</div>
