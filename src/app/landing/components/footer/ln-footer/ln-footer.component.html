<footer class="bg-white border-t border-gray-100 pt-16 pb-8 px-4">
  <div class="max-w-6xl mx-auto">

    <!-- Top Section -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-8 mb-14">

      <!-- Brand Column -->
      <div class="col-span-2">
        <a routerLink="/" class="flex items-center gap-2.5 mb-4 group">
          <div
            class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center
                   shadow-md shadow-indigo-200 group-hover:scale-105 transition-transform"
          >
            <svg viewBox="0 0 20 20" fill="none" class="w-4 h-4">
              <path
                d="M3 14L6 9L10 12L14 6L17 10"
                stroke="white"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>

          <span class="text-sm font-semibold text-gray-900">
            Creator<span class="text-indigo-600">Earn</span>
          </span>
        </a>

        <p class="text-sm text-gray-500 leading-relaxed max-w-xs">
          The revenue intelligence platform built for modern content creators.
          Track. Analyze. Earn more.
        </p>

        <!-- Social Icons -->
        <div class="flex items-center gap-3 mt-5">
          <a
            *ngFor="let social of socials"
            [href]="social.href"
            class="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center
                   text-gray-400 hover:text-gray-700 hover:border-gray-300 transition-all"
            [attr.aria-label]="social.name"
          >
            <span class="text-sm">{{ social.emoji }}</span>
          </a>
        </div>
      </div>

      <!-- Footer Links -->
      <div *ngFor="let col of footerLinks">
        <p
          class="text-xs font-semibold text-gray-900 uppercase tracking-wider mb-4"
        >
          {{ col.heading }}
        </p>

        <ul class="space-y-2.5">
          <li *ngFor="let link of col.links">
            <a
              [href]="link.href"
              class="text-sm text-gray-500 hover:text-gray-900 transition-colors"
            >
              {{ link.label }}
            </a>
          </li>
        </ul>
      </div>

    </div>

    <!-- Bottom Bar -->
    <div
      class="pt-6 border-t border-gray-100 flex flex-col sm:flex-row items-center
             justify-between gap-3 text-xs text-gray-400"
    >
      <p>© {{ year }} CreatorEarn. All rights reserved.</p>

      <div class="flex items-center gap-1.5">
        <span
          class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"
        ></span>
        All systems operational
      </div>

      <div class="flex items-center gap-4">
        <a href="#" class="hover:text-gray-700 transition-colors">Privacy</a>
        <a href="#" class="hover:text-gray-700 transition-colors">Terms</a>
        <a href="#" class="hover:text-gray-700 transition-colors">Cookies</a>
      </div>
    </div>

  </div>
</footer>
