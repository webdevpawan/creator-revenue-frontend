<section
  class="relative min-h-screen flex flex-col items-center justify-center
         overflow-hidden pt-24 pb-20 px-4"
>

  <!-- Background -->
  <div class="absolute inset-0 -z-10">

    <!-- Base Gradient -->
    <div
      class="absolute inset-0 bg-gradient-to-b from-indigo-50/60 via-white to-white"
    ></div>

    <!-- Top Glow -->
    <div
      class="absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[600px]
             rounded-full bg-indigo-200/30 blur-[120px]"
    ></div>

    <!-- Floating Orbs -->
    <div
      class="absolute top-32 left-[8%] w-64 h-64 rounded-full
             bg-violet-200/40 blur-[80px] animate-float-slow"
    ></div>

    <div
      class="absolute top-48 right-[6%] w-48 h-48 rounded-full
             bg-sky-200/40 blur-[60px] animate-float-medium"
    ></div>

    <div
      class="absolute bottom-24 left-[15%] w-40 h-40 rounded-full
             bg-indigo-200/30 blur-[60px] animate-float-slow"
    ></div>

    <!-- Dot Grid -->
    <div class="absolute inset-0 dot-grid opacity-[0.35]"></div>

  </div>

  <div class="max-w-4xl mx-auto text-center">

    <!-- Eyebrow -->
    <div
      class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full
             bg-white border border-indigo-100 shadow-sm shadow-indigo-100/50
             text-xs font-medium text-indigo-700 mb-8 hero-fade-in"
      style="animation-delay:0ms"
    >

      <span
        class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"
      ></span>

      Now in open beta — free for creators

    </div>

    <!-- Headline -->
    <h1
      class="text-5xl sm:text-6xl lg:text-7xl font-bold tracking-tight text-gray-950
             leading-[1.06] mb-6 hero-fade-in"
      style="animation-delay:80ms"
    >

      Track Every Reel.<br />

      <span class="relative inline-block">

        <span
          class="bg-gradient-to-r from-indigo-600 via-violet-600 to-indigo-500
                 bg-clip-text text-transparent"
        >
          Measure Every Earning.
        </span>

        <!-- Underline -->
        <svg
          class="absolute -bottom-2 left-0 w-full"
          viewBox="0 0 400 12"
          fill="none"
          preserveAspectRatio="none"
        >
          <path
            d="M2 9 C80 3, 180 11, 280 5 S360 2, 398 7"
            stroke="#6366f1"
            stroke-width="3"
            stroke-linecap="round"
            opacity="0.4"
          />
        </svg>

      </span>

    </h1>

    <!-- Subtitle -->
    <p
      class="text-lg sm:text-xl text-gray-500 max-w-2xl mx-auto leading-relaxed mb-10 hero-fade-in"
      style="animation-delay:160ms"
    >
      Track affiliate revenue, conversions, campaign performance, and creator
      analytics — all in one beautifully simple dashboard.
    </p>

    <!-- CTA Buttons -->
    <div
      class="flex flex-col sm:flex-row items-center justify-center gap-3 mb-16 hero-fade-in"
      style="animation-delay:240ms"
    >

      <!-- Primary -->
      <a
        routerLink="/signup"
        class="group w-full sm:w-auto inline-flex items-center justify-center gap-2
               px-7 py-3.5 bg-indigo-600 text-white font-semibold text-sm rounded-2xl
               shadow-lg shadow-indigo-200/60
               hover:bg-indigo-700 hover:shadow-xl hover:shadow-indigo-200/80
               hover:-translate-y-0.5 transition-all duration-200"
      >

        Start Tracking Free

        <svg
          class="w-4 h-4 group-hover:translate-x-0.5 transition-transform"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M13 7l5 5m0 0l-5 5m5-5H6"
          />
        </svg>

      </a>

      <!-- Secondary -->
      <a
        routerLink="/login"
        class="group w-full sm:w-auto inline-flex items-center justify-center gap-2
               px-7 py-3.5 bg-white text-gray-700 font-semibold text-sm rounded-2xl
               border border-gray-200 shadow-sm
               hover:border-gray-300 hover:bg-gray-50 hover:-translate-y-0.5
               transition-all duration-200"
      >

        <svg
          class="w-4 h-4 text-gray-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.75"
        >
          <path
            stroke-linecap="round"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
          />
        </svg>

        View Dashboard

      </a>

    </div>

    <!-- Social Proof -->
    <div
      class="flex items-center justify-center gap-3 hero-fade-in"
      style="animation-delay:320ms"
    >

      <!-- Avatars -->
      <div class="flex -space-x-2.5">

        <div
          *ngFor="let avatar of avatars"
          class="w-8 h-8 rounded-full border-2 border-white flex items-center
                 justify-center text-xs font-semibold text-white shadow-sm"
          [style.background]="avatar.color"
        >
          {{ avatar.initials }}
        </div>

      </div>

      <!-- Rating -->
      <div class="text-left">

        <div class="flex items-center gap-0.5">

          <svg
            *ngFor="let s of [1,2,3,4,5]"
            class="w-3.5 h-3.5 text-amber-400"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
            />
          </svg>

        </div>

        <p class="text-xs text-gray-400 mt-0.5">
          Loved by
          <span class="text-gray-600 font-semibold">2,400+</span>
          creators
        </p>

      </div>

    </div>

  </div>

</section>
