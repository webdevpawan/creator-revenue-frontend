<section id="features" class="py-24 px-4 bg-white">
  <div class="max-w-6xl mx-auto">

    <!-- Features Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">

      <div
        *ngFor="let feature of features"
        class="group relative p-6 rounded-2xl border border-gray-100 bg-white
               hover:border-indigo-100 hover:shadow-lg hover:shadow-indigo-50/50
               hover:-translate-y-1 transition-all duration-300"
      >

        <!-- ICON -->
        <div
          class="w-11 h-11 rounded-xl flex items-center justify-center mb-5"
          [ngClass]="feature.iconBg"
        >

          <ng-container [ngSwitch]="feature.icon">

            <!-- Revenue -->
            <svg
              *ngSwitchCase="'revenue'"
              class="w-5 h-5"
              [ngClass]="feature.iconColor"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8V7m0 1v8m0 0v1"
              />
            </svg>

            <!-- Analytics -->
            <svg
              *ngSwitchCase="'analytics'"
              class="w-5 h-5"
              [ngClass]="feature.iconColor"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 19V6m4 13V10m4 9V4"
              />
            </svg>

            <!-- Lightning -->
            <svg
              *ngSwitchCase="'lightning'"
              class="w-5 h-5"
              [ngClass]="feature.iconColor"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M13 10V3L4 14h7v7l9-11h-7z"
              />
            </svg>

            <!-- Upload -->
            <svg
              *ngSwitchCase="'upload'"
              class="w-5 h-5"
              [ngClass]="feature.iconColor"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
              />
            </svg>

            <!-- Link -->
            <svg
              *ngSwitchCase="'link'"
              class="w-5 h-5"
              [ngClass]="feature.iconColor"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101"
              />
            </svg>

            <!-- Dashboard -->
            <svg
              *ngSwitchCase="'dashboard'"
              class="w-5 h-5"
              [ngClass]="feature.iconColor"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16 8v8m-4-5v5m-4-2v2"
              />
            </svg>

          </ng-container>

        </div>

        <!-- Tag -->
        <span
          *ngIf="feature.tag"
          class="absolute top-5 right-5 text-[10px] font-semibold px-2 py-0.5
                 rounded-full bg-indigo-50 text-indigo-600"
        >
          {{ feature.tag }}
        </span>

        <!-- Title -->
        <h3 class="text-base font-semibold text-gray-900 mb-2">
          {{ feature.title }}
        </h3>

        <!-- Description -->
        <p class="text-sm text-gray-500 leading-relaxed">
          {{ feature.description }}
        </p>

      </div>

    </div>

  </div>
</section>
