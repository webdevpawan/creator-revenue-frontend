<section class="py-24 px-4 relative overflow-hidden">

  <!-- Background -->
  <div class="absolute inset-0 -z-10">
    <div
      class="absolute inset-0 bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-700"
    ></div>

    <!-- Noise Texture -->
    <div class="absolute inset-0 opacity-[0.03] noise-bg"></div>

    <!-- Radial Glows -->
    <div
      class="absolute top-0 left-1/4 w-96 h-96 rounded-full bg-white/10 blur-3xl"
    ></div>

    <div
      class="absolute bottom-0 right-1/4 w-80 h-80 rounded-full bg-violet-300/20 blur-3xl"
    ></div>

    <!-- Dot Grid -->
    <div class="absolute inset-0 dot-grid-white opacity-[0.08]"></div>
  </div>

  <div class="max-w-4xl mx-auto text-center">

    <!-- Pill -->
    <div
      class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full
             bg-white/15 border border-white/20 text-xs font-semibold
             /90 mb-8 backdrop-blur-sm"
    >
      <span
        class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"
      ></span>

      Free forever for solo creators
    </div>

    <!-- Headline -->
    <h2
      class="text-4xl sm:text-5xl lg:text-6xl font-bold  tracking-tight
             leading-tight mb-6"
    >
      Stop leaving money<br />
      on the table.
    </h2>

    <!-- Description -->
    <p
      class="text-lg sm:text-xl text-indigo-200 max-w-2xl mx-auto leading-relaxed mb-10"
    >
      Join 2,400+ creators who finally know which content drives real revenue.
      Set up in under 5 minutes. Free forever for up to 3 campaigns.
    </p>

    <!-- CTA Buttons -->
    <div
      class="flex flex-col sm:flex-row items-center justify-center gap-3 mb-14"
    >

      <!-- Primary Button -->
      <a
        routerLink="/auth/signup"
        class="group w-full sm:w-auto inline-flex items-center justify-center gap-2
               px-8 py-4 bg-white text-indigo-700 font-bold text-sm rounded-2xl
               shadow-xl shadow-indigo-900/20
               hover:shadow-2xl hover:-translate-y-1 hover:bg-gray-50
               transition-all duration-200"
      >
        Start Tracking Free

        <svg
          class="w-4 h-4 group-hover:translate-x-0.5 transition-transform"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M13 7l5 5m0 0l-5 5m5-5H6"
          />
        </svg>
      </a>

      <!-- Secondary Button -->
      <a
        routerLink="/dashboard"
        class="group w-full sm:w-auto inline-flex items-center justify-center gap-2
               px-8 py-4 bg-white/10 font-bold text-sm rounded-2xl
               border border-white/20 backdrop-blur-sm
               hover:bg-white/20 hover:-translate-y-1 transition-all duration-200"
      >

        <svg
          class="w-4 h-4 text-white/60"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.75"
        >
          <path
            stroke-linecap="round"
            d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
          />
        </svg>

        View Demo Dashboard
      </a>
    </div>

    <!-- Feature Checklist -->
    <div
      class="flex flex-wrap items-center justify-center gap-x-8 gap-y-3"
    >

      <div
        *ngFor="let item of checklistItems"
        class="flex items-center gap-2 text-sm text-indigo-200"
      >

        <svg
          class="w-4 h-4 text-emerald-400 shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M5 13l4 4L19 7"
          />
        </svg>

        {{ item }}
      </div>

    </div>

  </div>

  <!-- Decorative Bottom Wave -->
  <div class="absolute bottom-0 inset-x-0">
    <svg
      viewBox="0 0 1440 60"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      preserveAspectRatio="none"
      class="w-full h-16"
    >
      <path
        d="M0 60 L0 30 Q360 0 720 30 Q1080 60 1440 30 L1440 60 Z"
        fill="white"
      />
    </svg>
  </div>

</section>
