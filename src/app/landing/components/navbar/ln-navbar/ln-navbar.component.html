<header
  class="fixed top-0 inset-x-0 z-50 transition-all duration-300"
  [class.scrolled]="isScrolled()"
>
  <nav
    class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between"
  >

    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2.5 group">

      <div
        class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center
               shadow-md shadow-indigo-200 group-hover:scale-105 transition-transform"
      >
        <svg viewBox="0 0 20 20" fill="none" class="w-4 h-4">
          <path
            d="M3 14L6 9L10 12L14 6L17 10"
            stroke="white"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <span class="text-sm font-semibold text-gray-900 tracking-tight">
        Creator<span class="text-indigo-600">Earn</span>
      </span>

    </a>

    <!-- Desktop Nav -->
    <div class="hidden md:flex items-center gap-1">

      <a
        *ngFor="let link of navLinks"
        [href]="link.href"
        class="px-3 py-1.5 text-sm text-gray-500 font-medium rounded-lg
               hover:text-gray-900 hover:bg-gray-100/80 transition-all"
      >
        {{ link.label }}
      </a>

    </div>

    <!-- Desktop CTA -->
    <div class="hidden md:flex items-center gap-2">

      <a
        routerLink="/login"
        class="px-4 py-1.5 text-sm font-medium text-gray-600
               hover:text-gray-900 transition-colors"
      >
        Sign in
      </a>

      <a
        routerLink="/signup"
        class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-xl
               hover:bg-indigo-700 shadow-sm shadow-indigo-200
               transition-all hover:shadow-md hover:shadow-indigo-200 hover:-translate-y-0.5"
      >
        Start free
      </a>

    </div>

    <!-- Mobile Toggle -->
    <button
      (click)="mobileOpen = !mobileOpen"
      class="md:hidden w-9 h-9 rounded-xl border border-gray-200 flex items-center justify-center
             text-gray-500 hover:bg-gray-100 transition-colors"
    >

      <!-- Close Icon -->
      <svg
        *ngIf="mobileOpen"
        class="w-4 h-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>

      <!-- Hamburger Icon -->
      <svg
        *ngIf="!mobileOpen"
        class="w-4 h-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>

    </button>

  </nav>

  <!-- Mobile Dropdown -->
  <div
    *ngIf="mobileOpen"
    class="md:hidden mx-4 mb-3 bg-white rounded-2xl border border-gray-100
           shadow-xl p-4 space-y-1"
  >

    <!-- Mobile Links -->
    <a
      *ngFor="let link of navLinks"
      [href]="link.href"
      (click)="mobileOpen = false"
      class="block px-3 py-2.5 text-sm text-gray-600 font-medium rounded-xl
             hover:bg-gray-50 transition-colors"
    >
      {{ link.label }}
    </a>

    <!-- Mobile CTA -->
    <div class="pt-2 border-t border-gray-100 mt-2 flex flex-col gap-2">

      <a
        routerLink="/login"
        class="block text-center px-4 py-2.5 text-sm font-medium text-gray-700
               rounded-xl border border-gray-200 hover:bg-gray-50 transition-colors"
      >
        Sign in
      </a>

      <a
        routerLink="/signup"
        class="block text-center px-4 py-2.5 text-sm font-medium text-white
               bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors"
      >
        Start free
      </a>

    </div>

  </div>

</header>
