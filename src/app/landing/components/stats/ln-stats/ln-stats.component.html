<section class="py-16 px-4 border-y border-gray-100 bg-white/60 backdrop-blur-sm">
  <div class="max-w-6xl mx-auto">

    <!-- Section Label -->
    <p
      class="text-center text-xs font-semibold tracking-widest text-gray-400 uppercase mb-10"
    >
      Trusted by creators worldwide
    </p>

    <!-- Stats Grid -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-6">

      <div
        *ngFor="let stat of stats"
        class="group relative flex flex-col items-center text-center p-6 rounded-2xl
               bg-white border border-gray-100 shadow-sm
               hover:shadow-md hover:-translate-y-1 transition-all duration-300"
      >

        <!-- Icon -->
        <div
          class="w-10 h-10 rounded-xl flex items-center justify-center mb-4"
          [ngClass]="stat.bg"
        >
          <span class="text-lg">{{ stat.icon }}</span>
        </div>

        <!-- Value -->
        <p
          class="text-3xl font-bold text-gray-950 tracking-tight leading-none mb-1.5"
        >
          {{ stat.value }}
        </p>

        <!-- Label -->
        <p class="text-sm font-medium text-gray-700 mb-0.5">
          {{ stat.label }}
        </p>

        <!-- Sub -->
        <p class="text-xs text-gray-400">
          {{ stat.sub }}
        </p>

        <!-- Hover Glow -->
        <div
          class="absolute inset-0 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"
          [ngClass]="stat.color"
        ></div>

      </div>

    </div>

    <!-- Brand Logos -->
    <div class="mt-14 flex flex-wrap items-center justify-center gap-8">

      <p class="w-full text-center text-xs text-gray-400 font-medium mb-2">
        Works with your existing creator stack
      </p>

      <div
        *ngFor="let brand of brands"
        class="flex items-center gap-1.5 text-gray-400 hover:text-gray-600 transition-colors"
      >
        <span class="text-lg">{{ brand.emoji }}</span>
        <span class="text-sm font-semibold tracking-tight">
          {{ brand.name }}
        </span>
      </div>

    </div>

  </div>
</section>
